<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, Consolas, Menlo, monospace">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3131"/>
      <stop offset="50%" stop-color="#ff7849"/>
      <stop offset="100%" stop-color="#ff5e7d"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="678" height="298" rx="14" fill="#0a0a0d" stroke="#ff3131" stroke-opacity="0.25"/>

  <rect x="1" y="1" width="678" height="38" rx="14" fill="#141416"/>
  <rect x="1" y="27" width="678" height="12" fill="#141416"/>

  <circle cx="26" cy="20" r="6" fill="#ff3131"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="20" r="6" fill="#27c93f"/>
  <text x="340" y="25" text-anchor="middle" font-size="13" fill="#8b8b93">mike@rag-agent — zsh</text>

  <text x="24" y="76" font-size="15" fill="#e2e8f0">
    <tspan fill="#ff3131">$</tspan><tspan> query --topic "RAG en producción"</tspan>
  </text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
    <text x="24" y="110" font-size="15" fill="#a78bfa">› buscando en la base de conocimiento…</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
    <text x="24" y="136" font-size="15">
      <tspan fill="#8b8b93">› fuente: </tspan><tspan fill="#ff7849">experience.md</tspan><tspan fill="#8b8b93"> (score 0.94)</tspan>
    </text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.6s" fill="freeze"/>
    <text x="24" y="172" font-size="15" fill="#e2e8f0">"Embeddings en pgvector sobre PostgreSQL,</text>
    <text x="24" y="194" font-size="15" fill="#e2e8f0">&#160;orquestación en Node.js/Go, front en React."</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.4s" fill="freeze"/>
    <text x="24" y="230" font-size="15" fill="#ff3131">$</text>
    <rect x="40" y="219" width="9" height="16" fill="#e2e8f0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" begin="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="24" y="272" font-size="16" font-weight="bold" fill="url(#nameGrad)">Michael Anthony Arismendi</text>
  <text x="24" y="292" font-size="13" fill="#8b8b93">Full Stack Developer · AI &amp; RAG Integration · Serverless Cloud</text>
</svg>
