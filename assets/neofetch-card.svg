<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, Consolas, Menlo, monospace">
  <rect x="1" y="1" width="718" height="358" rx="14" fill="#0a0a0d" stroke="#ff3131" stroke-opacity="0.25"/>
  <rect x="1" y="1" width="718" height="38" rx="14" fill="#141416"/>
  <rect x="1" y="27" width="718" height="12" fill="#141416"/>
  <circle cx="26" cy="20" r="6" fill="#ff3131"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="20" r="6" fill="#27c93f"/>
  <text x="360" y="25" text-anchor="middle" font-size="13" fill="#8b8b93">michael@produccion — neofetch</text>

  <!-- M en pixel-art (guiño al grid de contribuciones) -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
    <!-- columna izquierda -->
    <rect x="40" y="78" width="14" height="14" rx="2" fill="#ff3131"/>
    <rect x="40" y="95" width="14" height="14" rx="2" fill="#f52f3f"/>
    <rect x="40" y="112" width="14" height="14" rx="2" fill="#ec2e4d"/>
    <rect x="40" y="129" width="14" height="14" rx="2" fill="#e22d5b"/>
    <rect x="40" y="146" width="14" height="14" rx="2" fill="#d92c69"/>
    <rect x="40" y="163" width="14" height="14" rx="2" fill="#cf2b77"/>
    <rect x="40" y="180" width="14" height="14" rx="2" fill="#c52a85"/>
    <!-- columna derecha -->
    <rect x="142" y="78" width="14" height="14" rx="2" fill="#ff3131"/>
    <rect x="142" y="95" width="14" height="14" rx="2" fill="#f52f3f"/>
    <rect x="142" y="112" width="14" height="14" rx="2" fill="#ec2e4d"/>
    <rect x="142" y="129" width="14" height="14" rx="2" fill="#e22d5b"/>
    <rect x="142" y="146" width="14" height="14" rx="2" fill="#d92c69"/>
    <rect x="142" y="163" width="14" height="14" rx="2" fill="#cf2b77"/>
    <rect x="142" y="180" width="14" height="14" rx="2" fill="#c52a85"/>
    <!-- diagonales -->
    <rect x="57" y="95" width="14" height="14" rx="2" fill="#ff7849"/>
    <rect x="125" y="95" width="14" height="14" rx="2" fill="#ff7849"/>
    <rect x="74" y="112" width="14" height="14" rx="2" fill="#ffa04d"/>
    <rect x="108" y="112" width="14" height="14" rx="2" fill="#ffa04d"/>
    <rect x="91" y="129" width="14" height="14" rx="2" fill="#fbbf24"/>
  </g>

  <!-- paleta estilo neofetch -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
    <rect x="40" y="214" width="13" height="13" fill="#ff3131"/>
    <rect x="55" y="214" width="13" height="13" fill="#ff7849"/>
    <rect x="70" y="214" width="13" height="13" fill="#fbbf24"/>
    <rect x="85" y="214" width="13" height="13" fill="#ff5e7d"/>
    <rect x="100" y="214" width="13" height="13" fill="#a78bfa"/>
    <rect x="115" y="214" width="13" height="13" fill="#e2e8f0"/>
    <rect x="130" y="214" width="13" height="13" fill="#8b8b93"/>
    <text x="98" y="252" text-anchor="middle" font-size="12" fill="#8b8b93">@michael23499</text>
  </g>

  <!-- info neofetch -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.5s" fill="freeze"/>
    <text x="196" y="84" font-size="14" font-weight="bold"><tspan fill="#ff3131">michael</tspan><tspan fill="#8b8b93">@</tspan><tspan fill="#ff7849">produccion</tspan></text>
    <text x="196" y="102" font-size="12" fill="#3a3a42">─────────────────────────────────────────</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <text x="196" y="126" font-size="13"><tspan fill="#ff3131" font-weight="bold">Host</tspan><tspan fill="#e2e8f0" x="300">Full Stack Developer</tspan></text>
    <text x="196" y="148" font-size="13"><tspan fill="#ff3131" font-weight="bold">Kernel</tspan><tspan fill="#e2e8f0" x="300">AI &amp; RAG Integration</tspan></text>
    <text x="196" y="170" font-size="13"><tspan fill="#ff3131" font-weight="bold">Uptime</tspan><tspan fill="#e2e8f0" x="300">5+ años en producción</tspan></text>
    <text x="196" y="192" font-size="13"><tspan fill="#ff3131" font-weight="bold">Shell</tspan><tspan fill="#e2e8f0" x="300">TypeScript · Go · Python</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    <text x="196" y="214" font-size="13"><tspan fill="#ff3131" font-weight="bold">Web</tspan><tspan fill="#e2e8f0" x="300">React · Next.js · Node.js</tspan></text>
    <text x="196" y="236" font-size="13"><tspan fill="#ff3131" font-weight="bold">Datos</tspan><tspan fill="#ff5e7d" x="300">PostgreSQL · MongoDB · Supabase</tspan></text>
    <text x="196" y="258" font-size="13"><tspan fill="#ff3131" font-weight="bold">Cloud</tspan><tspan fill="#fbbf24" x="300">AWS Lambda · GCP · Docker · Vercel</tspan></text>
    <text x="196" y="280" font-size="13"><tspan fill="#ff3131" font-weight="bold">IA</tspan><tspan fill="#a78bfa" x="300">Claude · Gemini · Groq · LangChain</tspan></text>
    <text x="196" y="302" font-size="13"><tspan fill="#ff3131" font-weight="bold">Focus</tspan><tspan fill="#e2e8f0" x="300">agentes RAG · citas verificables</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
    <text x="196" y="336" font-size="13"><tspan fill="#ff3131">$</tspan><tspan fill="#8b8b93" font-style="italic"> "si no sobrevive a usuarios reales, no está terminado"</tspan></text>
    <rect x="622" y="325" width="9" height="15" fill="#e2e8f0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" begin="2.7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
