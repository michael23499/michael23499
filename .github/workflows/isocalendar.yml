name: generate isocalendar

on:
  schedule:
    - cron: "30 0 * * *" # diario, tras el snake de las 00:00
  workflow_dispatch:

jobs:
  isocalendar:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          # PAT clásico SIN scopes guardado como secret (isocalendar lee el
          # calendario de contribuciones vía GraphQL y el token del job no llega).
          token: ${{ secrets.METRICS_TOKEN }}
          template: terminal
          base: header
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit
          committer_branch: metrics-output
          committer_message: "chore: actualiza isocalendar [skip ci]"
