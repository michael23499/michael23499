name: generate skyline

on:
  schedule:
    - cron: "0 0 1 * *" # una vez al mes: el skyline apenas cambia día a día
  workflow_dispatch:

jobs:
  skyline:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.skyline.svg
          token: NOT_NEEDED
          base: ""
          plugin_skyline: yes
          plugin_skyline_frames: 60
          plugin_skyline_quality: 0.6
          output_action: commit
          committer_branch: metrics-output
          committer_message: "chore: actualiza skyline [skip ci]"
